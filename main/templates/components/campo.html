{# Campo de formulario con etiqueta, ayuda y errores. Parametros: campo (obligatorio) y hint (opcional). #}
<div class="field{% if campo.errors %} field--error{% endif %}">
    <label class="label" for="{{ campo.id_for_label }}">{{ campo.label }}{% if campo.field.required and not campo.field.disabled %} <span class="req" aria-hidden="true">*</span>{% endif %}</label>
    {{ campo }}
    {% if hint %}<p class="hint">{{ hint }}</p>{% elif campo.help_text %}<div class="hint">{{ campo.help_text|safe }}</div>{% endif %}
    {% for error in campo.errors %}<p class="error">{{ error }}</p>{% endfor %}
</div>
